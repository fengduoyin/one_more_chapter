name: one-more-chapter

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3050
      SQLITE_PATH: /data/ocm_db.db
      UPLOADS_DIR: /data/uploads
      STATIC_DIR: frontend/dist
    volumes:
      - ./data:/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
