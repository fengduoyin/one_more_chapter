# Optional override: use a PostgreSQL instance you already run (e.g. on the host)
# instead of the bundled `db` service.
#
#   cp .env.example .env   # set DB_* to match your existing database
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml up --build
#
# In `.env` set for example:
#   DB_HOST=host.docker.internal
#   DB_PORT=5432
#   DB_NAME=reading_library
#   DB_USER=...
#   DB_PASSWORD=...

services:
  db:
    profiles: ["bundled-db-disabled"]

  app:
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-reading_library}
      DB_USER: ${DB_USER:?Set DB_USER in .env — copy .env.example and replace the example credentials}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — copy .env.example and replace the example credentials}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset []
